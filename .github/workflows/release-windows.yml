# 功能：Tag触发Windows三架构NSIS构建，全部成功后自动发布到同一Tag；时间：2026-11-14；作者：lq。
name: Release Windows
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本Tag（留空自动使用package.json的v版本号）'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-2022
            target: i686-pc-windows-msvc
            arch: x86
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify source
        run: pnpm verify
      # 功能：x86交叉构建也实际编译并执行对应测试，避免只测x64宿主；时间：2026-11-14；作者：lq。
      - name: Verify target Rust code
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Build NSIS and release assets
        run: node scripts/ci-build.mjs '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: output/ci/windows-${{ matrix.arch }}/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: release-assets
          merge-multiple: true
      - name: Publish all Windows architectures to tag
        run: node scripts/publish-release.mjs release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
