# 功能：Tag触发macOS三架构构建，全部成功后自动发布GitHub Release；时间：2026-11-14；作者：lq。
name: Release macOS
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本Tag（留空自动使用package.json的v版本号）'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            rust_targets: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            rust_targets: x86_64-apple-darwin
          - runner: macos-15
            target: universal-apple-darwin
            arch: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # 功能：可选Developer ID证书只进入临时钥匙串，配置不完整时停止而不降级签名；时间：2026-11-14；作者：lq。
      - name: Import signing identity when configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            if [ -n "$APPLE_CERTIFICATE" ]; then echo 'Configure APPLE_SIGNING_IDENTITY with certificate'; exit 1; fi
            echo 'Building without Developer ID signing or notarization'
            exit 0
          fi
          for value in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_ID" "$APPLE_PASSWORD" "$APPLE_TEAM_ID"; do
            if [ -z "$value" ]; then echo 'Signing/notarization configuration incomplete'; exit 1; fi
          done
          SAB_KEYCHAIN="$RUNNER_TEMP/sab-signing.keychain-db"
          SAB_CERT="$RUNNER_TEMP/sab-signing.p12"
          SAB_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SAB_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$SAB_CERT"
          security create-keychain -p "$SAB_PASSWORD" "$SAB_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SAB_KEYCHAIN"
          security unlock-keychain -p "$SAB_PASSWORD" "$SAB_KEYCHAIN"
          security import "$SAB_CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SAB_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$SAB_PASSWORD" "$SAB_KEYCHAIN"
          security list-keychains -d user -s "$SAB_KEYCHAIN"
          rm -f "$SAB_CERT"
      - name: Verify source
        run: pnpm verify
      - name: Build and check release assets
        run: node scripts/ci-build.mjs '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: output/ci/macos-${{ matrix.arch }}/*
          if-no-files-found: error
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sab-signing.p12"
          if [ -f "$RUNNER_TEMP/sab-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/sab-signing.keychain-db"; fi
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish all macOS architectures to tag
        run: node scripts/publish-release.mjs release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
